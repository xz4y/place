<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLACE - 작은 장소</title>

<!-- Supabase JS 라이브러리 불러오기 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

html, body {
    margin: 0;
    padding: 0;
    background: #d6d6d6;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
    font-size: 12px;
}

body {
    background:
        linear-gradient(#eeeeee 1px, transparent 1px),
        linear-gradient(90deg, #eeeeee 1px, transparent 1px);
    background-size: 8px 8px;
}

/* 전체 사이트 */

#site {
    width: 760px;
    margin: 25px auto;
    background: #ffffff;
    border: 1px solid #555;
    box-shadow: 2px 2px 0 #888;
}

/* 위쪽 */

#top {
    height: 70px;
    background: linear-gradient(#5f8fbd, #315d8b);
    border-bottom: 3px solid #24496e;
    color: white;
    position: relative;
}

#title {
    position: absolute;
    left: 18px;
    top: 12px;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: -1px;
}

#subtitle {
    position: absolute;
    left: 20px;
    top: 45px;
    font-size: 11px;
}

/* 메뉴 */

#menu {
    height: 27px;
    background: #eeeeee;
    border-bottom: 1px solid #999;
    padding-left: 8px;
}

.menu-button {
    display: inline-block;
    margin-top: 4px;
    margin-right: 3px;
    padding: 3px 12px;

    color: #222;
    text-decoration: none;

    background: linear-gradient(#ffffff, #cfcfcf);
    border: 1px solid #777;
    border-radius: 2px;

    box-shadow:
        inset 1px 1px 0 white,
        inset -1px -1px 0 #aaa;
}

.menu-button:active {
    background: #cccccc;
    box-shadow: inset 1px 1px 2px #777;
}

/* 안내 */

#notice {
    margin: 10px;
    padding: 6px 8px;

    border: 1px solid #999;
    background: #ffffcc;

    color: #444;
}

#notice a {
    color: #0000cc;
    text-decoration: underline;
}

/* 메인 */

#main {
    display: flex;
    gap: 10px;
    padding: 10px;
}

/* 왼쪽 */

#left {
    width: 500px;
}

.section-title {
    height: 22px;
    line-height: 22px;

    padding-left: 8px;

    color: white;
    font-weight: bold;

    background: linear-gradient(#6f9bc2, #3c6b99);

    border: 1px solid #345979;
}

.section {
    margin-bottom: 10px;
    border: 1px solid #999;
    background: #f7f7f7;
}

/* 맵 */

#world {
    height: 350px;
    position: relative;
    overflow: hidden;

    background: #9fbd7f;

    border: 3px inset #888;
}

.tree {
    position: absolute;
    width: 35px;
    height: 55px;
}

.tree-top {
    position: absolute;

    width: 35px;
    height: 35px;

    background: #3f7b35;

    border: 2px solid #275224;

    border-radius: 50% 50% 45% 45%;
}

.tree-trunk {
    position: absolute;

    left: 13px;
    top: 34px;

    width: 9px;
    height: 20px;

    background: #76502f;

    border-left: 2px solid #57391f;
    border-right: 2px solid #57391f;
}

.tree1 { left: 35px; top: 30px; }
.tree2 { right: 50px; top: 65px; }
.tree3 { left: 100px; bottom: 30px; }
.tree4 { right: 150px; bottom: 55px; }
.tree5 { left: 240px; top: 100px; }

.character {
    position: absolute;

    left: 50%;
    top: 48%;

    width: 18px;
    height: 30px;

    background: #333;

    border: 2px solid #111;

    transform: translate(-50%, -50%);
}

.character-head {
    position: absolute;

    left: 3px;
    top: -13px;

    width: 10px;
    height: 10px;

    background: #e0b08c;

    border: 1px solid #774f3b;
}

/* 숨겨진 장소 */

#secret {
    position: absolute;

    right: 45px;
    top: 160px;

    padding: 7px 10px;

    font-size: 11px;

    color: #222;

    background: linear-gradient(#ffffff, #cccccc);

    border: 2px outset #eeeeee;

    cursor: pointer;
}

#secret:active {
    border-style: inset;
}

/* 채팅 */

#messages {
    height: 145px;

    margin: 8px;

    overflow-y: auto;

    background: white;

    border: 2px inset #aaa;

    padding: 6px;

    font-size: 12px;
}

.message {
    margin-bottom: 5px;
}

.message-name {
    color: #003399;
    font-weight: bold;
}

/* 입력 */

#chat-input {
    display: flex;
    padding: 0 8px 8px 8px;
    gap: 4px;
}

#usernameInput {
    width: 70px;
    height: 24px;
    border: 2px inset #aaa;
    padding: 2px 5px;
    font-size: 12px;
}

#messageInput {
    flex: 1;

    height: 24px;

    border: 2px inset #aaa;

    padding: 2px 5px;

    font-size: 12px;
}

#sendButton {
    height: 30px;

    padding: 0 14px;

    background: linear-gradient(#ffffff, #cccccc);

    border: 2px outset #eeeeee;

    cursor: pointer;
}

#sendButton:active {
    border-style: inset;
}

/* 오른쪽 */

#right {
    width: 210px;
}

.side-box {
    margin-bottom: 10px;

    border: 1px solid #888;

    background: #eeeeee;
}

.side-title {
    padding: 5px;

    color: white;
    font-weight: bold;

    background: linear-gradient(#777777, #444444);
}

.side-content {
    padding: 8px;
    line-height: 1.6;
}

.online {
    color: green;
    font-weight: bold;
}

/* 하단 */

#footer {
    padding: 12px;

    text-align: center;

    border-top: 1px solid #999;

    background: #eeeeee;

    color: #666;

    font-size: 11px;
}

#counter {
    margin-top: 5px;
    color: #888;
}

a {
    color: #0000cc;
}

</style>
</head>

<body>

<div id="site">

    <div id="top">
        <div id="title">PLACE</div>
        <div id="subtitle">어딘가에 존재하는 작은 장소</div>
    </div>

    <div id="menu">
        <a href="index.html" class="menu-button">HOME</a>
        <a href="#world" class="menu-button">WORLD</a>
        <a href="#chat-section" class="menu-button">CHAT</a>
        <a href="#about" class="menu-button">ABOUT</a>
    </div>

    <div id="notice">
        현재 이곳에는 <b id="user-count">1명</b>이 접속해 있습니다.
        <a href="#">이용 안내</a>
    </div>

    <div id="main">

        <div id="left">

            <div class="section">

                <div class="section-title">
                    WORLD
                </div>

                <div style="padding:8px">

                    <div id="world">

                        <div class="tree tree1">
                            <div class="tree-top"></div>
                            <div class="tree-trunk"></div>
                        </div>

                        <div class="tree tree2">
                            <div class="tree-top"></div>
                            <div class="tree-trunk"></div>
                        </div>

                        <div class="tree tree3">
                            <div class="tree-top"></div>
                            <div class="tree-trunk"></div>
                        </div>

                        <div class="tree tree4">
                            <div class="tree-top"></div>
                            <div class="tree-trunk"></div>
                        </div>

                        <div class="tree tree5">
                            <div class="tree-top"></div>
                            <div class="tree-trunk"></div>
                        </div>

                        <div class="character">
                            <div class="character-head"></div>
                        </div>

                        <button id="secret" onclick="goToRoom()">
                            숨겨진 장소
                        </button>

                    </div>

                </div>

            </div>

            <div class="section" id="chat-section">

                <div class="section-title">
                    REALTIME CHAT
                </div>

                <div id="messages">
                    <div class="message">
                        <span class="message-name">SYSTEM</span> :
                        실시간 채팅 서버에 연결하는 중입니다...
                    </div>
                </div>

                <div id="chat-input">
                    <input id="usernameInput" type="text" placeholder="닉네임" value="Guest">
                    <input
                        id="messageInput"
                        type="text"
                        placeholder="메시지를 입력하세요"
                    >

                    <button id="sendButton" onclick="sendMessage()">
                        SEND
                    </button>

                </div>

            </div>

        </div>

        <div id="right">

            <div class="side-box">

                <div class="side-title">
                    INFORMATION
                </div>

                <div class="side-content">
                    이곳은 사람들이 잠시 머물다 가는 작은 장소입니다.
                    <br><br>
                    숨겨진 장소를 찾아보세요.
                </div>

            </div>

            <div class="side-box">

                <div class="side-title">
                    ONLINE
                </div>

                <div class="side-content">
                    <span class="online">● ONLINE</span>
                    <br>
                    <span id="side-online-text">실시간 연결 중</span>
                </div>

            </div>

            <div class="side-box">

                <div class="side-title">
                    MENU
                </div>

                <div class="side-content">
                    <a href="index.html">Home</a><br>
                    <a href="#world">World</a><br>
                    <a href="room.html">오래된 방</a><br>
                </div>

            </div>

        </div>

    </div>

    <div id="footer">
        PLACE © 2026
        <div id="counter">
            VISITOR : 000001
        </div>
    </div>

</div>

<script>

// Supabase 연동 설정
const SUPABASE_URL = "https://exeoqvfidmtmnwqejyvg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JFih0DSDJuYbePmte7BgEQ_Lt-0PFaV";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 기존 메시지 불러오기
async function loadMessages() {
    const { data, error } = await supabaseClient
        .from('chats')
        .select('*')
        .order('id', { ascending: true })
        .limit(50);

    if (error) {
        console.error('메시지 로딩 오류:', error);
        return;
    }

    const messagesContainer = document.getElementById("messages");
    messagesContainer.innerHTML = ""; // 초기화

    data.forEach(msg => {
        appendMessageUI(msg.username, msg.message);
    });

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// 화면에 메시지 추가하는 함수
function appendMessageUI(name, text) {
    const messages = document.getElementById("messages");
    const message = document.createElement("div");
    message.className = "message";
    message.innerHTML = '<span class="message-name">' + escapeHtml(name) + '</span> : ' + escapeHtml(text);
    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
}

// HTML 이스케이프 (보안용)
function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 메시지 전송 (Supabase DB에 저장)
async function sendMessage() {
    const nameInput = document.getElementById("usernameInput");
    const input = document.getElementById("messageInput");

    const username = nameInput.value.trim() || "Guest";
    const text = input.value.trim();

    if (text === "") return;

    input.value = "";

    const { error } = await supabaseClient
        .from('chats')
        .insert([{ username: username, message: text }]);

    if (error) {
        alert('메시지 전송에 실패했습니다: ' + error.message);
    }
}

// 엔터키 입력 처리
document.getElementById("messageInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

// 실시간 구독 (누군가 글을 쓰면 즉시 내 화면에도 뜸)
function subscribeRealtime() {
    supabaseClient
        .channel('public:chats')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, payload => {
            appendMessageUI(payload.new.username, payload.new.message);
        })
        .subscribe();
}

// 온라인 사람 수 실시간 접속자 추적 (Presence 기능)
function trackPresence() {
    const room = supabaseClient.channel('online-users');

    room.on('presence', { event: 'sync' }, () => {
        const state = room.presenceState();
        const count = Object.keys(state).length;
        document.getElementById("user-count").innerText = count + "명";
        document.getElementById("side-online-text").innerText = count + " users online";
    })
    .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
            await room.track({ online_at: new Date().toISOString() });
        }
    });
}

// 페이지 로드 시 실행
window.onload = () => {
    loadMessages();
    subscribeRealtime();
    trackPresence();
};

function goToRoom() {
    location.href = "room.html";
}

</script>

</body>
</html>
