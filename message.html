<style>

html, body {
    margin: 0;
    padding: 0;
    background: #d6d6d6;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
    font-size: 12px;
}

body {

}

#site {
    width: 760px;
    margin: 25px auto;
    background: #ffffff;

/* =========================
   TOP
========================= */

#top {

    background: linear-gradient(#5f8fbd, #315d8b);

}

#title {

    letter-spacing: -1px;
}

#subtitle {
    position: absolute;
    left: 20px;
    top: 45px;

}

#auth-bar {
    position: absolute;
    right: 15px;

    align-items: center;
}

.auth-btn {
    padding: 3px 8px;

    color: #222;
}

.auth-btn:active {
    border-style: inset;
}

.auth-btn:disabled {
    opacity: 0.5;

}

/* =========================
   MENU
========================= */

#menu {
    height: 27px;
    background: #eeeeee;
    border-bottom: 1px solid #999;
    padding-left: 8px;
}

.menu-button {
    display: inline-block;
    margin-top: 4px;

    color: #222;

    border: 1px solid #777;

    box-shadow:

.menu-button:hover {
    background: linear-gradient(#eeeeee, #cccccc);
}

/* =========================
   NOTICE
========================= */

#notice {
    margin: 10px;

}

.notice-left {
    display: inline-block;
}

.notice-right {

    color: #777;
}

/* =========================
   CONTENT
========================= */

#content {
    padding: 10px;
}

.page-title {
    font-size: 18px;
    font-weight: bold;
    border-bottom: 2px solid #555;
    padding-bottom: 6px;
    margin-bottom: 10px;
}

.section {
    border: 1px solid #999;
    background: #fafafa;
    margin-bottom: 12px;
}

.section-title {
    background: linear-gradient(#eeeeee, #d0d0d0);
    border-bottom: 1px solid #999;
    padding: 6px 8px;
    font-weight: bold;
}

.section-body {
    padding: 10px;
}

/* =========================
   LOGIN REQUIRED
========================= */

#login-required {
    border: 1px solid #aaa;
    background: #f5f5f5;
    padding: 14px;
    text-align: center;
    margin-bottom: 12px;
}

#login-required button {
    margin-top: 8px;
}

/* =========================
   MESSAGE FORM
========================= */

.form-row {
    margin-bottom: 8px;
}

.form-row label {
    display: block;
    margin-bottom: 3px;
    font-weight: bold;
}

.form-input,
.form-textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #888;
    background: white;
    padding: 6px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
}

.form-textarea {
    height: 130px;
    resize: vertical;
}

.form-input:focus,
.form-textarea:focus {
    outline: none;
    border-color: #315d8b;
}

.send-button {
    padding: 5px 14px;
    background: linear-gradient(#ffffff, #cccccc);
    border: 1px outset #eee;
    cursor: pointer;
    font-size: 12px;
}

.send-button:active {
    border-style: inset;
}

.send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.message-result {
    margin-top: 8px;
    padding: 6px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    display: none;
}

/* =========================
   MAILBOX
========================= */

.mailbox {
    width: 100%;
    border-collapse: collapse;
}

.mailbox th {
    background: #e5e5e5;
    border: 1px solid #999;
    padding: 6px;
    text-align: left;
}

.mailbox td {
    border: 1px solid #bbb;
    padding: 6px;
}

.mailbox tr.unread {
    font-weight: bold;
    background: #fffde6;
}

.mailbox tr:hover {
    background: #f0f0f0;
    cursor: pointer;
}

.no-message {
    padding: 20px;
    text-align: center;
    color: #777;
}

/* =========================
   MESSAGE READER
========================= */

#message-reader {
    display: none;
}

.reader-header {
    border-bottom: 1px solid #aaa;
    padding-bottom: 8px;
    margin-bottom: 10px;
}

.reader-subject {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 6px;
}

.reader-meta {
    color: #777;
    font-size: 11px;
}

.reader-body {
    min-height: 150px;
    border: 1px solid #ccc;
    background: white;
    padding: 10px;
    white-space: pre-wrap;
    word-break: break-word;
}

.back-button {
    margin-top: 10px;
    padding: 4px 12px;
    background: linear-gradient(#fff, #ccc);
    border: 1px outset #eee;
    cursor: pointer;
}

/* =========================
   ADMIN
========================= */

#admin-message-section {
    display: none;
}

.admin-warning {
    padding: 7px;
    background: #fff4d6;
    border: 1px solid #d4a300;
    margin-bottom: 8px;
}

/* =========================
   FOOTER
========================= */

#footer {
    margin-top: 15px;
    padding: 12px;
    border-top: 1px solid #aaa;
    text-align: center;
    color: #777;
    font-size: 11px;
}

.hidden {
    display: none !important;
}

.clear {
    clear: both;
}

</style>
</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://exeoqvfidmtmnwqejyvg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JFih0DSDJuYbePmte7BgEQ_Lt-0PFaV";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;
let currentProfile = null;
let isAdmin = false;

let messageRealtimeChannel = null;


/* =========================================
   NAVIGATION
========================================= */

function goLogin() {
    window.location.href = "index.html";
}

function goSignup() {
    window.location.href = "index.html";
}

function goProfile() {
    window.location.href = "index.html#profile";
}


/* =========================================
   AUTH
========================================= */

async function checkAuth() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        showLoggedOut();

        return;

    }

    currentUser = session.user;

    await loadProfile();

    showLoggedIn();

    await loadMessages();

    subscribeMessages();

}


async function loadProfile() {

    if (!currentUser) {
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

    if (error) {

        console.error(
            "프로필 불러오기 실패:",
            error
        );

        return;

    }

    currentProfile = data;

    isAdmin =
        data.is_admin === true;

}


function showLoggedOut() {

    currentUser = null;
    currentProfile = null;
    isAdmin = false;

    document
        .getElementById("user-info")
        .textContent = "로그인 필요";

    document
        .getElementById("login-btn")
        .style.display = "";

    document
        .getElementById("signup-btn")
        .style.display = "";

    document
        .getElementById("logout-btn")
        .style.display = "none";

    document
        .getElementById("login-required")
        .style.display = "block";

    document
        .getElementById("write-message-section")
        .style.display = "none";

    document
        .getElementById("inbox-section")
        .style.display = "none";

    document
        .getElementById("admin-message-section")
        .style.display = "none";

    document
        .getElementById("admin-menu")
        .style.display = "none";

    document
        .getElementById("status")
        .textContent = "로그인 필요";

}


function showLoggedIn() {

    document
        .getElementById("login-required")
        .style.display = "none";

    document
        .getElementById("write-message-section")
        .style.display = "block";

    document
        .getElementById("inbox-section")
        .style.display = "block";

    document
        .getElementById("login-btn")
        .style.display = "none";

    document
        .getElementById("signup-btn")
        .style.display = "none";

    document
        .getElementById("logout-btn")
        .style.display = "";

    document
        .getElementById("admin-message-section")
        .style.display =
            isAdmin ? "block" : "none";

    document
        .getElementById("admin-menu")
        .style.display =
            isAdmin ? "inline-block" : "none";

    let displayName =
        currentProfile?.nickname ||
        currentProfile?.username ||
        currentUser.email ||
        "사용자";

    document
        .getElementById("user-info")
        .textContent =
            displayName;

    document
        .getElementById("status")
        .textContent =
            "로그인됨";

}


async function logout() {

    await supabaseClient.auth.signOut();

    if (messageRealtimeChannel) {

        await supabaseClient
            .removeChannel(
                messageRealtimeChannel
            );

        messageRealtimeChannel = null;

    }

    showLoggedOut();

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    if (!currentUser) {

        alert(
            "로그인이 필요합니다"
        );

        return;

    }


    const recipient =
        document
            .getElementById("recipient")
            .value
            .trim();

    const subject =
        document
            .getElementById("subject")
            .value
            .trim();

    const body =
        document
            .getElementById("body")
            .value
            .trim();


    if (!recipient) {

        alert(
            "받는 사람을 입력해주세요"
        );

        return;

    }


    const myUsername =
        String(
            currentProfile?.username ||
            ""
        ).trim().toLowerCase();

    if (
        myUsername &&
        recipient.toLowerCase() ===
            myUsername
    ) {

        alert(
            "자기 자신에게는 메시지를 보낼 수 없습니다"
        );

        return;

    }


    if (!subject) {

        alert(
            "제목을 입력해주세요"
        );

        return;

    }


    if (!body) {

        alert(
            "내용을 입력해주세요"
        );

        return;

    }


    const button =
        document
            .getElementById("send-button");

    const result =
        document
            .getElementById("message-result");


    button.disabled = true;

    button.textContent =
        "보내는 중...";


    const {
        data,
        error
    } = await supabaseClient.rpc(
        "send_message",
        {
            p_recipient_username:
                recipient,

            p_subject:
                subject,

            p_body:
                body
        }
    );


    if (error) {

        console.error(
            "메시지 전송 오류:",
            error
        );

        result.style.display =
            "block";

        result.textContent =
            "메시지를 보내지 못했습니다: " +
            error.message;

        button.disabled = false;

        button.textContent =
            "메시지 보내기";

        return;

    }


    result.style.display =
        "block";

    result.textContent =
        "메시지를 보냈습니다";


    document
        .getElementById("recipient")
        .value = "";

    document
        .getElementById("subject")
        .value = "";

    document
        .getElementById("body")
        .value = "";


    button.disabled = false;

    button.textContent =
        "메시지 보내기";


    await loadMessages();

}


/* =========================================
   ADMIN SEND
========================================= */

async function adminSendMessage() {

    if (!currentUser || !isAdmin) {

        alert(
            "관리자만 사용할 수 있습니다"
        );

        return;

    }


    const recipient =
        document
            .getElementById("admin-recipient")
            .value;

    const subject =
        document
            .getElementById("admin-subject")
            .value
            .trim();

    const body =
        document
            .getElementById("admin-body")
            .value
            .trim();


    if (!subject) {

        alert(
            "제목을 입력해주세요"
        );

        return;

    }


    if (!body) {

        alert(
            "내용을 입력해주세요"
        );

        return;

    }


    const result =
        document
            .getElementById("admin-result");


    result.style.display =
        "block";

    result.textContent =
        "보내는 중...";


    let response;


    if (recipient === "EVERYONE") {

        response =
            await supabaseClient.rpc(
                "admin_send_message_everyone",
                {
                    p_subject:
                        subject,

                    p_body:
                        body
                }
            );

    } else {

        response =
            await supabaseClient.rpc(
                "send_message",
                {
                    p_recipient_username:
                        recipient,

                    p_subject:
                        subject,

                    p_body:
                        body
                }
            );

    }


    if (response.error) {

        console.error(
            response.error
        );

        result.textContent =
            "전송 실패: " +
            response.error.message;

        return;

    }


    result.textContent =
        "메시지를 보냈습니다";


    document
        .getElementById("admin-subject")
        .value = "";

    document
        .getElementById("admin-body")
        .value = "";


    await loadMessages();

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages() {

    if (!currentUser) {
        return;
    }


    const container =
        document
            .getElementById("mailbox-container");


    container.innerHTML =
        '<div class="no-message">불러오는 중...</div>';


    /*
       먼저 기존 recipient_id 기준으로 조회합니다.
       이 값이 비어 있으면 username 기준으로 한 번 더 조회합니다.
       Supabase 함수에서 수신자 식별자를 어떤 방식으로 저장하더라도
       받은 편지함에서 놓치지 않도록 하는 fallback입니다.
    */
    let {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "recipient_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );

    if (error) {

        console.error(
            "recipient_id 기준 메시지 조회 오류:",
            error
        );

    }

    /*
       recipient_id 조회 결과가 없을 때만
       recipient_username 컬럼이 있는 경우를 시도합니다.
       컬럼이 없는 DB라면 이 조회는 실패하지만
       기존 recipient_id 결과를 그대로 사용합니다.
    */
    if (
        (!Array.isArray(data) || data.length === 0) &&
        currentProfile?.username
    ) {

        const fallbackResult =
            await supabaseClient
                .from("messages")
                .select("*")
                .eq(
                    "recipient_username",
                    currentProfile.username
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );

        if (
            !fallbackResult.error &&
            Array.isArray(fallbackResult.data)
        ) {

            data = fallbackResult.data;
            error = null;

        }

    }


    if (
        error &&
        (!Array.isArray(data) || data.length === 0)
    ) {

        console.error(
            "메시지 불러오기 오류:",
            error
        );

        container.innerHTML =
            '<div class="no-message">메시지를 불러오지 못했습니다</div>';

        return;

    }


    renderMailbox(
        data || []
    );

}


/* =========================================
   RENDER MAILBOX
========================================= */

function renderMailbox(messages) {

    const container =
        document
            .getElementById("mailbox-container");


    if (!messages.length) {

        container.innerHTML =
            '<div class="no-message">받은 메시지가 없습니다</div>';

        return;

    }


    let html = `
        <table class="mailbox">

            <thead>

                <tr>
                    <th style="width:70px;">상태</th>
                    <th>제목</th>
                    <th style="width:130px;">보낸 사람</th>
                    <th style="width:120px;">날짜</th>
                </tr>

            </thead>

            <tbody>
    `;


    messages.forEach(
        message => {

            const isUnread =
                message.is_read === false ||
                message.read_at == null &&
                message.recipient_id === currentUser.id;


            const sender =
                message.sender_username ||
                message.sender_name ||
                message.sender_id ||
                "-";


            const subject =
                escapeHtml(
                    message.subject ||
                    "(제목 없음)"
                );


            const date =
                formatDate(
                    message.created_at
                );


            html += `

                <tr
                    class="${isUnread ? "unread" : ""}"
                    onclick="openMessage('${message.id}')"
                >

                    <td>
                        ${
                            isUnread
                                ? "● 새 메시지"
                                : "읽음"
                        }
                    </td>

                    <td>
                        ${subject}
                    </td>

                    <td>
                        ${escapeHtml(
                            String(sender)
                        )}
                    </td>

                    <td>
                        ${date}
                    </td>

                </tr>

            `;

        }
    );


    html += `
            </tbody>

        </table>
    `;


    container.innerHTML =
        html;

}


/* =========================================
   OPEN MESSAGE
========================================= */

async function openMessage(id) {

    if (!currentUser) {
        return;
    }


    let {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq("id", id)
        .eq("recipient_id", currentUser.id)
        .single();

    /*
       recipient_id 방식으로 찾지 못한 경우
       recipient_username 기준으로 다시 찾습니다.
    */
    if (
        error &&
        currentProfile?.username
    ) {

        const fallbackResult =
            await supabaseClient
                .from("messages")
                .select("*")
                .eq("id", id)
                .eq(
                    "recipient_username",
                    currentProfile.username
                )
                .single();

        if (!fallbackResult.error) {

            data = fallbackResult.data;
            error = null;

        }

    }


    if (error) {

        console.error(
            error
        );

        alert(
            "메시지를 불러오지 못했습니다"
        );

        return;

    }


    document
        .getElementById("reader-subject")
        .textContent =
            data.subject ||
            "(제목 없음)";


    const sender =
        data.sender_username ||
        data.sender_name ||
        data.sender_id ||
        "-";


    document
        .getElementById("reader-meta")
        .textContent =
            "보낸 사람: " +
            sender +
            " · " +
            formatDate(
                data.created_at
            );


    document
        .getElementById("reader-body")
        .textContent =
            data.body || "";


    document
        .getElementById("message-reader")
        .style.display =
            "block";


    document
        .getElementById("inbox-section")
        .style.display =
            "none";


    /*
       받은 메시지라면 읽음 처리
    */

    if (
        data.recipient_id ===
        currentUser.id
    ) {

        const {
            error: readError
        } = await supabaseClient.rpc(
            "mark_message_read",
            {
                p_message_id:
                    id
            }
        );


        if (readError) {

            console.error(
                "읽음 처리 오류:",
                readError
            );

        }

    }

}


/* =========================================
   CLOSE MESSAGE
========================================= */

async function closeMessage() {

    document
        .getElementById("message-reader")
        .style.display =
            "none";

    document
        .getElementById("inbox-section")
        .style.display =
            "block";

    await loadMessages();

}


/* =========================================
   REALTIME
========================================= */

function subscribeMessages() {

    if (!currentUser) {
        return;
    }


    if (messageRealtimeChannel) {

        supabaseClient
            .removeChannel(
                messageRealtimeChannel
            );

    }


    messageRealtimeChannel =
        supabaseClient
            .channel(
                "message-page-" +
                currentUser.id
            )
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "messages"
                },
                async () => {

                    await loadMessages();

                }
            )
            .subscribe();

}


/* =========================================
   DATE
========================================= */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(
            dateString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            dateString
        );

    }


    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    const hour =
        String(
            date.getHours()
        ).padStart(
            2,
            "0"
        );

    const minute =
        String(
            date.getMinutes()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day +
        " " +
        hour +
        ":" +
        minute
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if (
            event === "SIGNED_IN" &&
            session
        ) {

            currentUser =
                session.user;

            await loadProfile();

            showLoggedIn();

            await loadMessages();

            subscribeMessages();

        }


        if (
            event === "SIGNED_OUT"
        ) {

            showLoggedOut();

        }

    }
);


/* =========================================
   PAGE LOAD
========================================= */

window.addEventListener(
    "load",
    async () => {

        await checkAuth();

    }
);

</script>
