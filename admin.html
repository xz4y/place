<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PLACE — ADMIN</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background:
        linear-gradient(#eeeeee 1px, transparent 1px),
        linear-gradient(90deg, #eeeeee 1px, transparent 1px);

    background-size: 8px 8px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    color: #222;
}

#site {
    width: 760px;
    margin: 25px auto;

    background: white;

    border: 1px solid #555;

    box-shadow: 2px 2px 0 #888;
}

#top {
    height: 70px;
    position: relative;

    background:
        linear-gradient(
            #5f8fbd,
            #315d8b
        );

    border-bottom: 3px solid #24496e;
    color: white;
}

#title {
    position: absolute;

    left: 18px;
    top: 12px;

    font-size: 28px;
    font-weight: bold;
}

#subtitle {
    position: absolute;

    left: 20px;
    top: 45px;

    font-size: 11px;
}

#user-info {
    position: absolute;

    right: 15px;
    top: 15px;
}

#menu {
    height: 27px;

    background: #ddd;

    border-bottom: 1px solid #999;
}

.menu-button {
    display: inline-block;

    margin-left: 5px;
    padding: 3px 12px;

    color: #222;
    text-decoration: none;

    background:
        linear-gradient(#fff, #d8d8d8);

    border: 1px solid #999;

    border-top-color: #fff;
    border-left-color: #fff;

    border-radius: 2px;

    box-shadow:
        inset 0 -1px 0 #aaa;
}

.menu-button:hover {
    background:
        linear-gradient(#e9e9e9, #cfcfcf);
}

#content {
    padding: 10px;
}

.section {
    margin-bottom: 10px;

    background: #f7f7f7;

    border: 1px solid #999;
}

.section-title {
    height: 22px;
    line-height: 22px;

    padding-left: 8px;

    color: white;
    font-weight: bold;

    background:
        linear-gradient(#6b93ba, #416d99);

    border-bottom: 1px solid #345b7e;
}

.section-body {
    padding: 10px;
}

input,
textarea,
select {
    width: 100%;

    padding: 5px;

    border: 1px solid #888;

    background: white;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
}

textarea {
    height: 70px;
    resize: vertical;
}

#ban-reason {
    height: 55px;
    resize: vertical;
}

button {
    padding: 5px 10px;

    font-size: 11px;

    background:
        linear-gradient(#fff, #ddd);

    border: 1px solid #777;

    border-top-color: #fff;
    border-left-color: #fff;

    cursor: pointer;
}

button:hover {
    background:
        linear-gradient(#eee, #ccc);
}

.danger {
    background:
        linear-gradient(#fff, #e9caca);

    color: #800;
}

.admin-action {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 5px;

    margin-top: 8px;
}

.banner-item {
    position: relative;

    margin-bottom: 6px;

    padding: 8px 30px 8px 8px;

    background: #fffbea;

    border: 1px solid #d5c36a;
}

.banner-item:last-child {
    margin-bottom: 0;
}

.banner-message {
    font-weight: bold;
}

.banner-date {
    margin-top: 5px;

    color: #777;

    font-size: 10px;
}

.banner-delete {
    position: absolute;

    right: 5px;
    top: 5px;

    width: 20px;
    height: 20px;

    padding: 0;

    color: #800;
}

#message {
    margin-bottom: 8px;

    padding: 6px;

    display: none;

    border: 1px solid #999;

    background: #eee;
}

#message.error {
    background: #ffe0e0;
    border-color: #c77;
}

#message.success {
    background: #e0ffe0;
    border-color: #7c7;
}

#login-required {
    padding: 20px;
    text-align: center;
}

.hidden {
    display: none !important;
}

.small {
    margin-top: 4px;

    color: #777;

    font-size: 10px;
}

.row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

#footer {
    padding: 12px;

    text-align: center;

    border-top: 1px solid #999;

    background: #eee;

    color: #666;

    font-size: 11px;
}

#footer a {
    color: #666;
    text-decoration: none;
}

#footer a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div id="site">

    <div id="top">

        <div id="title">
            PLACE
        </div>

        <div id="subtitle">
            ADMINISTRATION PANEL
        </div>

        <div id="user-info">
            관리자 확인 중...
        </div>

    </div>


    <div id="menu">

        <a
            href="index.html"
            class="menu-button"
        >
            HOME
        </a>

        <a
            href="message.html"
            class="menu-button"
        >
            MESSAGE
        </a>

        <a
            href="admin.html"
            class="menu-button"
        >
            ADMIN
        </a>

    </div>


    <div id="content">

        <div id="message"></div>


        <div id="login-required">
            관리자 권한이 필요합니다
        </div>


        <div
            id="admin-content"
            class="hidden"
        >


            <!-- =========================
                 USER MANAGEMENT
            ========================== -->

            <div class="section">

                <div class="section-title">
                    USER MANAGEMENT
                </div>

                <div class="section-body">

                    <label>
                        사용자 아이디
                    </label>

                    <input
                        id="target-username"
                        type="text"
                        placeholder="사용자 아이디"
                    >

                    <div class="small">
                        대상 사용자의 계정 아이디를 입력하세요
                    </div>


                    <br>


                    <label>
                        밴 사유
                    </label>

                    <textarea
                        id="ban-reason"
                        placeholder="밴 또는 경고 사유를 입력하세요"
                    ></textarea>

                    <div class="small">
                        밴, 아이디밴, 소프트밴, 하드밴, 경고를 실행할 때 사용됩니다
                    </div>


                    <div class="admin-action">

                        <button
                            onclick="runUserAction('idban')"
                        >
                            아이디밴
                        </button>

                        <button
                            onclick="runUserAction('ban')"
                        >
                            밴
                        </button>

                        <button
                            onclick="runUserAction('softban')"
                        >
                            소프트밴
                        </button>

                        <button
                            onclick="runUserAction('hardban')"
                        >
                            하드밴
                        </button>

                        <button
                            onclick="runUserAction('warning')"
                        >
                            경고
                        </button>

                        <button
                            onclick="runUserAction('chatlock')"
                        >
                            채팅 제한
                        </button>

                        <button
                            class="danger"
                            onclick="runUserAction('unban')"
                        >
                            제한 해제
                        </button>

                    </div>

                </div>

            </div>


            <!-- =========================
                 BANNER MANAGEMENT
            ========================== -->

            <div class="section">

                <div class="section-title">
                    BANNER MANAGEMENT
                </div>

                <div class="section-body">

                    <div id="banner-list">
                        배너를 불러오는 중...
                    </div>

                    <hr>


                    <label>
                        배너 내용
                    </label>

                    <textarea
                        id="banner-message"
                        placeholder="배너에 표시할 내용을 입력하세요"
                    ></textarea>


                    <div class="row">

                        <div>

                            <label>
                                시작
                            </label>

                            <input
                                id="banner-start"
                                type="datetime-local"
                            >

                        </div>


                        <div>

                            <label>
                                종료
                            </label>

                            <input
                                id="banner-end"
                                type="datetime-local"
                            >

                        </div>

                    </div>


                    <br>


                    <button
                        onclick="createBanner()"
                    >
                        배너 등록
                    </button>


                    <div class="small">
                        활성 배너는 최대 3개까지 등록할 수 있습니다
                    </div>

                </div>

            </div>


            <!-- =========================
                 CHAT MANAGEMENT
            ========================== -->

            <div class="section">

                <div class="section-title">
                    CHAT MANAGEMENT
                </div>

                <div class="section-body">

                    <button
                        class="danger"
                        onclick="cleanChat()"
                    >
                        전체 채팅 삭제
                    </button>

                </div>

            </div>


        </div>

    </div>


    <div id="footer">
        PLACE © 2026
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://exeoqvfidmtmnwqejyvg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JFih0DSDJuYbePmte7BgEQ_Lt-0PFaV";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;

let currentProfile = null;


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type = ""
) {

    const box =
        document.getElementById(
            "message"
        );


    box.innerText = text;


    box.className = "";

    box.id = "message";


    if (type) {

        box.classList.add(type);

    }


    box.style.display =
        "block";
}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        document.getElementById(
            "user-info"
        ).innerText =
            "로그인 필요";

        return false;
    }


    currentUser =
        session.user;


    const {
        data: profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .single();


    if (
        error ||
        !profile
    ) {

        console.error(error);


        showMessage(
            "프로필을 불러올 수 없습니다.",
            "error"
        );


        return false;
    }


    currentProfile =
        profile;


    document.getElementById(
        "user-info"
    ).innerText =
        "관리자: " +
        (
            profile.nickname ||
            profile.username
        );


    if (
        profile.is_admin !== true
    ) {

        showMessage(
            "관리자 권한이 없습니다.",
            "error"
        );


        return false;
    }


    document.getElementById(
        "login-required"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "admin-content"
    ).classList.remove(
        "hidden"
    );


    await loadBanners();


    return true;
}


/* =========================
   BANNER LOAD
========================= */

async function loadBanners() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("banners")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "배너 불러오기 실패:",
            error
        );

        return;
    }


    const list =
        document.getElementById(
            "banner-list"
        );


    list.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            '<div class="small">등록된 배너가 없습니다</div>';

        return;
    }


    data.forEach(
        banner => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "banner-item";


            const start =
                new Date(
                    banner.starts_at
                ).toLocaleString(
                    "ko-KR"
                );


            const end =
                banner.ends_at

                    ? new Date(
                        banner.ends_at
                    ).toLocaleString(
                        "ko-KR"
                    )

                    : "기간 제한 없음";


            item.innerHTML = `

                <div class="banner-message">
                    📢 ${escapeHtml(
                        banner.message
                    )}
                </div>

                <div class="banner-date">
                    ${start}
                    ~
                    ${end}
                </div>

                <button
                    class="banner-delete"
                    onclick="deleteBanner(${banner.id})"
                >
                    X
                </button>

            `;


            list.appendChild(item);

        }
    );
}


/* =========================
   CREATE BANNER
========================= */

async function createBanner() {

    const message =
        document.getElementById(
            "banner-message"
        ).value.trim();


    const start =
        document.getElementById(
            "banner-start"
        ).value;


    const end =
        document.getElementById(
            "banner-end"
        ).value;


    if (!message) {

        showMessage(
            "배너 내용을 입력해주세요.",
            "error"
        );

        return;
    }


    if (!start) {

        showMessage(
            "시작 시간을 입력해주세요.",
            "error"
        );

        return;
    }


    const {
        error
    } =
        await supabaseClient.rpc(
            "admin_create_banner",
            {

                p_message:
                    message,

                p_starts_at:
                    new Date(
                        start
                    ).toISOString(),

                p_ends_at:
                    end
                        ? new Date(
                            end
                        ).toISOString()
                        : null

            }
        );


    if (error) {

        console.error(
            "배너 등록 오류:",
            error
        );


        showMessage(
            error.message,
            "error"
        );


        return;
    }


    document.getElementById(
        "banner-message"
    ).value = "";


    document.getElementById(
        "banner-start"
    ).value = "";


    document.getElementById(
        "banner-end"
    ).value = "";


    showMessage(
        "배너가 등록되었습니다.",
        "success"
    );


    await loadBanners();
    /* =========================
   DELETE BANNER
========================= */

async function deleteBanner(id) {

    const confirmed =
        confirm(
            "정말 이 배너를 삭제하시겠습니까?\n\n삭제하면 다시 복구할 수 없습니다."
        );


    if (!confirmed) {

        return;
    }


    const {
        error
    } =
        await supabaseClient.rpc(
            "admin_delete_banner",
            {

                p_banner_id:
                    id

            }
        );


    if (error) {

        console.error(
            "배너 삭제 오류:",
            error
        );


        showMessage(
            error.message,
            "error"
        );


        return;
    }


    showMessage(
        "배너가 삭제되었습니다.",
        "success"
    );


    await loadBanners();
}


/* =========================
   USER ACTION
========================= */

async function runUserAction(
    action
) {

    const username =
        document.getElementById(
            "target-username"
        ).value.trim();


    const reason =
        document.getElementById(
            "ban-reason"
        ).value.trim();


    if (!username) {

        showMessage(
            "대상 사용자 아이디를 입력해주세요.",
            "error"
        );

        return;
    }


    const actionNames = {

        idban:
            "아이디밴",

        ban:
            "밴",

        softban:
            "소프트밴",

        hardban:
            "하드밴",

        warning:
            "경고",

        chatlock:
            "채팅 제한",

        unban:
            "제한 해제"

    };


    const actionName =
        actionNames[action] ||
        action;


    /* =========================
       BAN REASON CHECK
    ========================== */

    if (
        action === "idban" ||
        action === "ban" ||
        action === "softban" ||
        action === "hardban" ||
        action === "warning"
    ) {

        if (!reason) {

            showMessage(
                "밴 사유를 입력해주세요.",
                "error"
            );

            return;
        }

    }


    /* =========================
       CONFIRM
    ========================== */

    let confirmMessage =
        username +
        " 사용자에게 " +
        actionName +
        " 명령을 실행하시겠습니까?";


    if (
        action === "idban" ||
        action === "ban" ||
        action === "softban" ||
        action === "hardban" ||
        action === "warning"
    ) {

        confirmMessage +=
            "\n\n사유: " +
            reason;

    }


    if (
        !confirm(
            confirmMessage
        )
    ) {

        return;
    }


    /* =========================
       UNBAN
    ========================== */

    if (
        action === "unban"
    ) {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "admin_unban",
                {

                    target_username:
                        username

                }
            );


        if (error) {

            console.error(
                "UNBAN ERROR:",
                error
            );


            showMessage(
                error.message,
                "error"
            );


            return;
        }


        console.log(
            "UNBAN RESULT:",
            data
        );


        showMessage(
            username +
            " 사용자의 제한이 해제되었습니다.",
            "success"
        );


        return;
    }


    /* =========================
       CHATLOCK
    ========================== */

    if (
        action === "chatlock"
    ) {

        const {
            error
        } =
            await supabaseClient.rpc(
                "admin_set_chatlock",
                {

                    p_username:
                        username

                }
            );


        if (error) {

            console.error(
                "CHATLOCK ERROR:",
                error
            );


            showMessage(
                error.message,
                "error"
            );


            return;
        }


        showMessage(
            username +
            " 사용자의 채팅이 제한되었습니다.",
            "success"
        );


        return;
    }


    /* =========================
       BAN
    ========================== */

    if (
        action === "ban" ||
        action === "softban" ||
        action === "hardban" ||
        action === "idban"
    ) {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "admin_set_ban",
                {

                    target_username:
                        username,

                    new_ban_type:
                        action,

                    new_ban_until:
                        null,

                    new_ban_reason:
                        reason

                }
            );


        if (error) {

            console.error(
                "BAN ERROR:",
                error
            );


            showMessage(
                error.message,
                "error"
            );


            return;
        }


        console.log(
            "BAN RESULT:",
            data
        );


        document.getElementById(
            "ban-reason"
        ).value = "";


        showMessage(
            username +
            " 사용자에게 " +
            actionName +
            " 처리가 완료되었습니다.",
            "success"
        );


        return;
    }


    /* =========================
       WARNING
    ========================== */

    if (
        action === "warning"
    ) {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "admin_set_ban",
                {

                    target_username:
                        username,

                    new_ban_type:
                        "warning",

                    new_ban_until:
                        null,

                    new_ban_reason:
                        reason

                }
            );


        if (error) {

            console.error(
                "WARNING ERROR:",
                error
            );


            showMessage(
                error.message,
                "error"
            );


            return;
        }


        console.log(
            "WARNING RESULT:",
            data
        );


        document.getElementById(
            "ban-reason"
        ).value = "";


        showMessage(
            username +
            " 사용자에게 경고가 적용되었습니다.",
            "success"
        );


        return;
    }


    showMessage(
        "알 수 없는 관리자 명령입니다.",
        "error"
    );
}


/* =========================
   CHAT CLEAN
========================= */

async function cleanChat() {

    if (
        !confirm(
            "정말 전체 채팅을 삭제하시겠습니까?"
        )
    ) {

        return;
    }


    const {
        error
    } =
        await supabaseClient.rpc(
            "admin_clean_chat"
        );


    if (error) {

        console.error(
            "CHAT CLEAN ERROR:",
            error
        );


        showMessage(
            error.message,
            "error"
        );


        return;
    }


    showMessage(
        "전체 채팅이 삭제되었습니다.",
        "success"
    );
}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   START
========================= */

window.onload =
    async () => {

        await checkAdmin();

    };


supabaseClient.auth.onAuthStateChange(
    async () => {

        await checkAdmin();

    }
);

</script>

</body>
</html>
